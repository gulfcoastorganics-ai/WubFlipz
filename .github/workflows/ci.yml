name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: find js -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Serve application
        run: python3 -m http.server 4173 >/tmp/wubflipz-http.log 2>&1 &
      - name: Smoke entrypoint
        run: |
          for i in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/tmp/wubflipz-index.html; then
              break
            fi
            sleep 0.25
          done
          test -s /tmp/wubflipz-index.html
          grep -qi "WubFlipz" /tmp/wubflipz-index.html
